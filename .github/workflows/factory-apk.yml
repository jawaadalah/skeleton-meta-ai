name: Factory APK

on:
  push:
    branches: [main]
    paths: ['factory/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read current app
        id: cur
        run: |
          SLUG=$(python3 -c "import json;print(json.load(open('factory/current.json'))['slug'])")
          NAME=$(python3 -c "import json;print(json.load(open('factory/current.json'))['name'])")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: factory/${{ steps.cur.outputs.slug }}
        run: gradle assembleDebug --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG="${{ steps.cur.outputs.slug }}"
          NAME="${{ steps.cur.outputs.name }}"
          cp "factory/$SLUG/app/build/outputs/apk/debug/app-debug.apk" "$SLUG.apk"
          gh release view "apk-$SLUG" >/dev/null 2>&1 || gh release create "apk-$SLUG" --title "$NAME (APK)" --notes "APK dibuat otomatis oleh Your Agent."
          gh release upload "apk-$SLUG" "$SLUG.apk" --clobber
