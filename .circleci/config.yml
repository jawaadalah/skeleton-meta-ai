# Cadangan build APK Your Agent — TIDAK AKTIF OTOMATIS.
# Dipakai hanya bila GitHub Actions bermasalah. Dijalankan manual dari
# dashboard CircleCI (Trigger Pipeline). Dibuat sebagai draf lokal
# 23 Nov 2026, belum di-commit — minta persetujuan user dulu.
# Cocok dengan .github/workflows/android-apk.yml: Java 17, Gradle 8.9,
# gradle assembleDebug di folder android/ (repo ini tanpa gradlew).
# Free tier CircleCI: 30.000 credits/bln (~6.000 menit mesin small);
# repo publik bisa diajukan sebagai proyek open-source (400.000 credits/bln).
version: 2.1

jobs:
  build-debug-apk:
    docker:
      - image: cimg/android:2024.01
    steps:
      - checkout
      - run:
          name: Install Gradle 8.9
          command: |
            curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
            unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
            echo 'export PATH=/tmp/gradle-8.9/bin:$PATH' >> "$BASH_ENV"
      - run:
          name: Build debug APK
          command: |
            export PATH=/tmp/gradle-8.9/bin:$PATH
            cd android && gradle assembleDebug --stacktrace
      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: app-debug.apk

workflows:
  manual-only:
    jobs:
      - build-debug-apk
